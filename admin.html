<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Rise Academy - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .login-box,
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .stat h3 {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .stat p {
      font-size: 25px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 10px;
      color: #dc2626;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <p style="margin:10px 0 20px;color:#6b7280;">
      Nova Rise Academy
    </p>

    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="adminLogin()">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>


  <div id="adminSection" class="hidden">

    <header>
      <h1>Nova Rise Academy — Admin Panel</h1>
      <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">

      <div class="card">
        <h2>Welcome Admin</h2>
        <p id="adminEmail" style="margin-top:8px;color:#6b7280;"></p>
      </div>

      <div class="stats">

        <div class="stat">
          <h3>Members</h3>
          <p id="memberCount">0</p>
        </div>

        <div class="stat">
          <h3>Membership Plans</h3>
          <p id="planCount">0</p>
        </div>

        <div class="stat">
          <h3>Payments</h3>
          <p id="paymentCount">0</p>
        </div>

      </div>

      <div class="card">
        <h2>Payment Records</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Plan</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="paymentTable">
              <tr>
                <td colspan="5">Loading...</td>
              </tr>
            </tbody>

          </table>
        </div>

      </div>

    </div>
  </div>


<script>

  /* =====================================================
     SUPABASE SETTINGS
     =====================================================

     IMPORTANT:
     Yahan wahi SUPABASE URL aur PUBLISHABLE KEY lagao
     jo tumhare login.html mein already working hai.

  ===================================================== */

  const SUPABASE_URL = https://cbmpqytinlrvvbjzirkx.supabase.co

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wI01RZkPQ1MsfAQBVVUHyg_ETCmkjvw"
    
  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  async function adminLogin() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {
      message.textContent =
        "Email aur password enter karo.";
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    showAdmin(data.user);
  }


  function showAdmin(user) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    document
      .getElementById("adminEmail")
      .textContent = user.email;

    loadAdminData();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();
  }


  async function checkLogin() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session && data.session.user) {
      showAdmin(data.session.user);
    }
  }


  async function loadAdminData() {

    try {

      const members =
        await supabaseClient
          .from("profiles")
          .select("*", { count: "exact", head: true });

      document.getElementById("memberCount").textContent =
        members.count ?? 0;


      const plans =
        await supabaseClient
          .from("membership_plans")
          .select("*", { count: "exact", head: true });

      document.getElementById("planCount").textContent =
        plans.count ?? 0;


      const payments =
        await supabaseClient
          .from("payments")
          .select("*");

      if (payments.error) {
        document.getElementById("paymentCount").textContent = "0";

        document.getElementById("paymentTable").innerHTML =
          "<tr><td colspan='5'>Payment data access nahi ho raha.</td></tr>";

        return;
      }


      const paymentData = payments.data || [];

      document.getElementById("paymentCount").textContent =
        paymentData.length;


      if (paymentData.length === 0) {

        document.getElementById("paymentTable").innerHTML =
          "<tr><td colspan='5'>No payment records found.</td></tr>";

        return;
      }


      let html = "";

      paymentData.forEach(function(payment) {

        html += `
          <tr>
            <td>${payment.id ?? "-"}</td>
            <td>${payment.user_id ?? payment.member_id ?? "-"}</td>
            <td>${payment.plan_id ?? "-"}</td>
            <td>₹${payment.amount ?? "-"}</td>
            <td>${payment.status ?? "Pending"}</td>
          </tr>
        `;

      });


      document.getElementById("paymentTable").innerHTML =
        html;

    } catch (error) {

      console.error(error);

      document.getElementById("paymentTable").innerHTML =
        "<tr><td colspan='5'>Data load karte waqt error aaya.</td></tr>";
    }
  }


  checkLogin();

</script>

</body>
</html>
