 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Nova Rise Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #0d6efd;
      font-size: 28px;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d6dce5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0d6efd;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #084298;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #666;
      font-size: 14px;
    }

    .switch a {
      color: #0d6efd;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0d6efd;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>Nova Rise Academy</h1>
      <p>Skills • Freelancing • Company Work</p>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">
      <h2>Member Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
      >

      <button onclick="loginUser()">Login</button>

      <div class="switch">
        Don't have an account?
        <a onclick="showRegister()">Register</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="hidden">
      <h2>Create Account</h2>

      <input
        type="text"
        id="registerName"
        placeholder="Full name"
      >

      <input
        type="email"
        id="registerEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Create password"
      >

      <button onclick="registerUser()">Register</button>

      <div class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </div>
    </div>

    <div id="message"></div>

    <a href="index.html" class="back">← Back to Website</a>

  </div>

<script>

  /*
    IMPORTANT:
    Replace these two values with your Supabase
    Project URL and ANON/PUBLIC key.

    NEVER put the Service Role key here.
  */

  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  function showRegister() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
    document.getElementById("message").innerText = "";
  }


  function showLogin() {
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("message").innerText = "";
  }


  async function registerUser() {

    const name =
      document.getElementById("registerName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const message =
      document.getElementById("message");

    if (!name || !email || !password) {
      message.innerText =
        "Please fill all fields.";
      return;
    }

    if (password.length < 6) {
      message.innerText =
        "Password must be at least 6 characters.";
      return;
    }

    message.innerText = "Creating account...";

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name
          }
        }
      });

    if (error) {
      message.innerText = error.message;
      return;
    }

    message.innerText =
      "Registration successful. Check your email if verification is required.";

  }


  async function loginUser() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("message");

    if (!email || !password) {
      message.innerText =
        "Please enter email and password.";
      return;
    }

    message.innerText = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.innerText = error.message;
      return;
    }

    message.innerText =
      "Login successful. Opening dashboard...";

    setTimeout(() => {
      window.location.href = "member.html";
    }, 800);

  }

</script>

</body>
</htm
